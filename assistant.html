<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مساعد سوق مباشر</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f5f6f8;
    color:#222;
}

header{
    background:#0d6efd;
    color:white;
    padding:18px 15px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

header h1{
    font-size:24px;
    margin-bottom:6px;
}

header p{
    font-size:14px;
    opacity:.9;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px 15px;
}

.assistant{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.welcome{
    text-align:center;
    margin-bottom:20px;
}

.welcome h2{
    color:#0d6efd;
    margin-bottom:8px;
}

.welcome p{
    color:#666;
    line-height:1.8;
}

.messages{
    min-height:250px;
    max-height:400px;
    overflow-y:auto;
    margin-bottom:15px;
}

.message{
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
    line-height:1.7;
}

.bot{
    background:#eef5ff;
    text-align:right;
}

.user{
    background:#0d6efd;
    color:white;
    text-align:right;
}

.input-area{
    display:flex;
    gap:8px;
}

input{
    flex:1;
    border:1px solid #ddd;
    border-radius:12px;
    padding:13px;
    font-size:15px;
    outline:none;
}

.send{
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:12px;
    padding:13px 18px;
    cursor:pointer;
}

.back{
    width:100%;
    margin-top:15px;
    background:#e9ecef;
    color:#222;
    border:none;
    border-radius:12px;
    padding:13px;
    font-size:15px;
    cursor:pointer;
}

footer{
    text-align:center;
    color:#888;
    font-size:13px;
    margin-top:25px;
}

</style>

</head>

<body>

<header>

<h1>🤖 مساعد سوق مباشر</h1>

<p>اسألني عن الأسعار والمنتجات</p>

</header>


<div class="container">

<div class="assistant">

<div class="welcome">

<h2>أهلاً بك 👋</h2>

<p>
أنا مساعد سوق مباشر.
<br>
اكتب سؤالك وسأساعدك قدر الإمكان.
</p>

</div>


<div class="messages" id="messages">

<div class="message bot">
🤖 أهلاً بك في مساعد سوق مباشر.
<br>
يمكنك أن تسألني مثل:
<br>
«كم سعر الدقيق؟»
<br>
«كم سعر الأرز؟»
<br>
«ما المنتجات الموجودة؟»
</div>

</div>


<div class="input-area">

<input
type="text"
id="userInput"
placeholder="اكتب سؤالك هنا..."
onkeydown="if(event.key==='Enter') sendMessage()"
>

<button class="send" onclick="sendMessage()">
إرسال
</button>

</div>


<button class="back" onclick="location.href='index.html'">
⬅️ العودة إلى سوق مباشر
</button>

</div>


<footer>

سوق مباشر © 2026

</footer>

</div>


<script>

function sendMessage(){

const input = document.getElementById("userInput");
const messages = document.getElementById("messages");

const text = input.value.trim();

if(!text) return;


/* رسالة المستخدم */

const userMessage = document.createElement("div");

userMessage.className = "message user";

userMessage.textContent = text;

messages.appendChild(userMessage);


/* رد المساعد */

const botMessage = document.createElement("div");

botMessage.className = "message bot";

botMessage.innerHTML =
"🤖 وصلتني رسالتك.<br>" +
"المساعد حالياً في نسخته الأولى، وسنربطه قريباً بأسعار ومنتجات سوق مباشر.";

messages.appendChild(botMessage);


input.value = "";

messages.scrollTop = messages.scrollHeight;

}

</script>

</body>

</html>
