<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المنتجات | سوق مباشر</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f5f6f8;
    color:#222;
}

/* الهيدر */

header{
    background:#0d6efd;
    color:white;
    padding:16px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:10;
}

header h1{
    font-size:23px;
}

header p{
    margin-top:5px;
    font-size:13px;
    opacity:.9;
}

/* زر السلة */

.cart-button{
    display:block;
    width:100%;
    max-width:900px;
    margin:12px auto 0;
    padding:12px;
    background:white;
    color:#0d6efd;
    text-decoration:none;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
}

.cart-count{
    background:#dc3545;
    color:white;
    border-radius:20px;
    padding:3px 8px;
    margin-right:5px;
}

/* المحتوى */

.container{
    max-width:900px;
    margin:auto;
    padding:20px 15px;
}

/* البحث */

.search-box{
    background:white;
    padding:15px;
    border-radius:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
    margin-bottom:20px;
}

.search-box input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

.search-box input:focus{
    border-color:#0d6efd;
}

/* المنتجات */

.products{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.product{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.product-image{
    height:150px;
    background:#eee;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product-info{
    padding:13px;
}

.product-name{
    font-size:16px;
    font-weight:bold;
    margin-bottom:8px;
}

.product-description{
    color:#777;
    font-size:13px;
    line-height:1.6;
    min-height:40px;
}

.price{
    color:#0d6efd;
    font-size:18px;
    font-weight:bold;
    margin:10px 0;
}

.add-btn{
    width:100%;
    border:none;
    background:#0d6efd;
    color:white;
    padding:11px;
    border-radius:9px;
    font-size:14px;
    cursor:pointer;
}

.add-btn:active{
    transform:scale(.98);
}

/* لا توجد منتجات */

.empty{
    background:white;
    padding:30px;
    border-radius:15px;
    text-align:center;
    color:#777;
    grid-column:1/-1;
}

/* زر الرجوع */

.back{
    display:block;
    text-align:center;
    margin-top:25px;
    color:#0d6efd;
    text-decoration:none;
    font-size:15px;
}

/* الشاشات الصغيرة */

@media(max-width:450px){

    .products{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .product-image{
        height:120px;
    }

    .product-info{
        padding:10px;
    }

    .product-name{
        font-size:14px;
    }

    .price{
        font-size:16px;
    }

}

</style>

</head>

<body>

<header>

<h1>🛒 منتجات سوق مباشر</h1>

<p>اختر المنتج الذي تبحث عنه</p>

<a href="cart.html" class="cart-button">

🛒 السلة

<span id="cartCount" class="cart-count">
0
</span>

</a>

</header>


<div class="container">

<div class="search-box">

<input
type="search"
id="search"
placeholder="🔎 ابحث عن منتج..."
oninput="searchProducts()"
>

</div>


<div
class="products"
id="products">

<div class="empty">

⏳

<h3 style="margin:12px 0;">
جاري تحميل المنتجات...
</h3>

</div>

</div>


<a
href="index.html"
class="back">

⬅️ العودة للرئيسية

</a>

</div>


<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const productsBox =
    document.getElementById("products");


let allProducts = [];


/* ==============================
   السلة
============================== */

function getCart(){

    return JSON.parse(
        localStorage.getItem("souqMubasherCart") || "[]"
    );

}


function updateCartCount(){

    const cart = getCart();

    let count = 0;

    cart.forEach(item => {

        count += Number(item.quantity || 1);

    });

    document.getElementById("cartCount").textContent = count;

}



/* ==============================
   تحميل المنتجات من Firebase
============================== */

async function loadProducts(){

    productsBox.innerHTML = `
        <div class="empty">
            ⏳
            <h3 style="margin:12px 0;">
                جاري تحميل المنتجات...
            </h3>
        </div>
    `;

    try{

        const ref =
            collection(db, "products");

        const snapshot =
            await getDocs(ref);

        console.log(
            "عدد المنتجات:",
            snapshot.size
        );


        allProducts = [];


        snapshot.forEach(doc => {

            allProducts.push({

                id: doc.id,

                ...doc.data()

            });

        });


        displayProducts(allProducts);


    }catch(error){

        console.error(
            "خطأ Firebase:",
            error
        );


        productsBox.innerHTML = `

            <div class="empty">

                ❌

                <h3 style="margin:12px 0;">
                    حدث خطأ في تحميل المنتجات
                </h3>

                <p style="direction:ltr;font-size:12px;margin-top:10px;">
                    ${error.code || "unknown-error"}
                </p>

            </div>

        `;

    }

}



/* ==============================
   عرض المنتجات
============================== */

function displayProducts(products){

    if(products.length === 0){

        productsBox.innerHTML = `

            <div class="empty">

                🛒

                <h3 style="margin:12px 0;">
                    لا توجد منتجات
                </h3>

                <p>
                    سيتم إضافة المنتجات قريبًا.
                </p>

            </div>

        `;

        return;

    }


    let html = "";


    products.forEach(product => {

        const name =
            product.name ||
            product.اسم ||
            "منتج";


        const price =
            Number(
                product.price ??
                product.سعر ??
                0
            );


        const description =
            product.description ||
            product.الوصف ||
            "";


        const image =
            product.image ||
            product.صورة ||
            "";


        html += `

        <div
            class="product"
            data-name="${String(name).toLowerCase()}">

            <div class="product-image">

                ${
                    image

                    ?

                    `<img
                        src="${image}"
                        alt="${name}"
                        onerror="this.style.display='none';"
                    >`

                    :

                    `🛒`
                }

            </div>


            <div class="product-info">

                <div class="product-name">
                    ${name}
                </div>


                <div class="product-description">
                    ${description}
                </div>


                <div class="price">
                    ${price} ريال
                </div>


                <button
                    class="add-btn"
                    data-name="${name}"
                    data-price="${price}"
                    data-image="${image}"
                    data-description="${description}">

                    🛒 إضافة للسلة

                </button>

            </div>

        </div>

        `;

    });


    productsBox.innerHTML = html;


    /* ربط أزرار السلة */

    document
        .querySelectorAll(".add-btn")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    addToCart(

                        button.dataset.name,

                        Number(
                            button.dataset.price
                        ),

                        button.dataset.image,

                        button.dataset.description

                    );

                }
            );

        });

}



/* ==============================
   إضافة للسلة
============================== */

function addToCart(
    name,
    price,
    image,
    description
){

    let cart = getCart();


    const existing =
        cart.find(
            item => item.name === name
        );


    if(existing){

        existing.quantity =
            Number(existing.quantity || 1) + 1;

    }else{

        cart.push({

            name: name,

            price: price,

            image: image,

            description: description,

            quantity: 1

        });

    }


    localStorage.setItem(
        "souqMubasherCart",
        JSON.stringify(cart)
    );


    updateCartCount();


    alert(
        "تمت إضافة " +
        name +
        " إلى السلة 🛒"
    );

}



/* ==============================
   البحث
============================== */

window.searchProducts = function(){

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    if(!search){

        displayProducts(allProducts);

        return;

    }


    const filtered =
        allProducts.filter(product => {

            const name =
                String(
                    product.name ||
                    product.اسم ||
                    ""
                ).toLowerCase();


            const description =
                String(
                    product.description ||
                    product.الوصف ||
                    ""
                ).toLowerCase();


            return (
                name.includes(search) ||
                description.includes(search)
            );

        });


    if(filtered.length === 0){

        productsBox.innerHTML = `

            <div class="empty">

                🔎

                <h3 style="margin:12px 0;">
                    لم يتم العثور على المنتج
                </h3>

                <p>
                    جرّب البحث باسم آخر.
                </p>

            </div>

        `;

        return;

    }


    displayProducts(filtered);

};



/* ==============================
   تشغيل
============================== */

updateCartCount();

loadProducts();

        </script>

    
                    
                    
        
</body>

</html>
