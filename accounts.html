<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>حسابات سوق مباشر</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f4f6f9;
    color:#222;
}

header{
    background:#0d6efd;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    font-size:22px;
}

header p{
    margin-top:6px;
    font-size:13px;
    opacity:.9;
}

.container{
    max-width:850px;
    margin:auto;
    padding:18px 14px;
}

.box{
    background:white;
    border-radius:15px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.box h2{
    color:#0d6efd;
    font-size:19px;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:9px;
    margin-bottom:10px;
    font-size:14px;
    outline:none;
}

input:focus{
    border-color:#0d6efd;
}

button{
    border:0;
    border-radius:9px;
    padding:12px 15px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
}

button:disabled{
    background:#999 !important;
}

.add{
    width:100%;
    background:#198754;
    color:white;
}

.payment{
    background:#0d6efd;
    color:white;
    width:100%;
    margin-top:10px;
}

.deposit{
    width:100%;
    background:#198754;
    color:white;
}

.withdraw{
    width:100%;
    background:#dc3545;
    color:white;
    margin-top:10px;
}

.danger{
    background:#dc3545;
    color:white;
}

.shop{
    border:1px solid #eee;
    border-radius:13px;
    padding:15px;
    margin-bottom:14px;
    background:#fff;
}

.shop-title{
    color:#0d6efd;
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.balance{
    background:#f1f4f8;
    border-radius:10px;
    padding:12px;
    margin-top:10px;
    font-size:17px;
    font-weight:bold;
}

.debt{
    color:#dc3545;
}

.paid{
    color:#198754;
}

.line{
    border-bottom:1px solid #eee;
    padding:10px 0;
    line-height:1.8;
}

.small{
    color:#777;
    font-size:12px;
}

.empty{
    text-align:center;
    color:#777;
    padding:25px;
}

.error{
    background:#f8d7da;
    color:#842029;
    padding:12px;
    border-radius:10px;
    margin-bottom:12px;
    line-height:1.7;
}

.success{
    background:#d1e7dd;
    color:#0f5132;
    padding:12px;
    border-radius:10px;
    margin-bottom:12px;
    line-height:1.7;
}

.loading{
    text-align:center;
    color:#777;
    padding:25px;
}

.back{
    width:100%;
    background:#6c757d;
    color:white;
    margin-top:10px;
}

.money-card{
    background:#f1f4f8;
    border-radius:14px;
    padding:20px;
    text-align:center;
    margin-bottom:15px;
}

.money-card .title{
    color:#555;
    font-size:14px;
}

.money-card .amount{
    font-size:30px;
    font-weight:bold;
    color:#198754;
    margin-top:8px;
}

.transaction{
    border-bottom:1px solid #eee;
    padding:12px 0;
    line-height:1.8;
}

.transaction:last-child{
    border-bottom:0;
}

.deposit-text{
    color:#198754;
    font-weight:bold;
}

.withdraw-text{
    color:#dc3545;
    font-weight:bold;
}

.actions{
    margin-top:10px;
}

.delete-btn{
    background:#dc3545;
    color:white;
    padding:7px 10px;
    font-size:12px;
}

</style>

</head>

<body>

<header>

<h1>💰 حسابات سوق مباشر</h1>

<p>
دفتر الحسابات والأموال
</p>

</header>


<div class="container">


<!-- =====================================
     حسابي الشخصي
===================================== -->

<div class="box">

<h2>💰 حسابي أنا</h2>

<div id="moneyMessage"
class="error"
style="display:none">
</div>


<div class="money-card">

<div class="title">
الرصيد الحالي
</div>

<div
id="myBalance"
class="amount">

0 ريال

</div>

</div>


<h3 style="margin-bottom:12px;color:#198754;">
➕ تسجيل إيداع
</h3>


<input
type="number"
id="depositAmount"
placeholder="مبلغ الإيداع بالريال"
>


<input
type="text"
id="depositNote"
placeholder="ملاحظة الإيداع - مثال: راتب، رأس مال، توفير"
>


<button
id="depositButton"
class="deposit">

➕ حفظ الإيداع

</button>


<h3
style="margin-top:20px;margin-bottom:12px;color:#dc3545;">

➖ تسجيل سحب

</h3>


<input
type="number"
id="withdrawAmount"
placeholder="مبلغ السحب بالريال"
>


<input
type="text"
id="withdrawNote"
placeholder="ملاحظة السحب - مثال: مصاريف، شراء، تحويل"
>


<button
id="withdrawButton"
class="withdraw">

➖ حفظ السحب

</button>

</div>


<!-- =====================================
     سجل أموالي
===================================== -->

<div class="box">

<h2>📋 سجل إيداعاتي وسحوباتي</h2>

<div id="transactionsList"
class="loading">

جاري تحميل الحركات...

</div>

</div>


<!-- =====================================
     حسابات البقالات
===================================== -->

<div class="box">

<h2>🏪 حسابات البقالات</h2>

<div id="errorBox"
class="error"
style="display:none">
</div>


<input
type="text"
id="shopName"
placeholder="اسم البقالة"
>


<input
type="text"
id="productName"
placeholder="المنتج"
>


<input
type="number"
id="amount"
placeholder="المبلغ بالريال"
>


<button
id="addSale"
class="add">

➕ إضافة بيع آجل

</button>


<button
id="addPayment"
class="payment">

💵 تسجيل سداد

</button>

</div>


<div class="box">

<h2>📒 دفتر حسابات البقالات</h2>

<div id="accountsList"
class="loading">

جاري تحميل الحسابات...

</div>

</div>


<button
class="back"
onclick="window.location.href='admin.html'">

⬅️ العودة إلى الإدارة

</button>


</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
   Firebase
========================================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyAXZqvb11VBhk7OfH68zY5VPQe01ZtKa-w",

    authDomain:
    "souq-mubasher-c9d87.firebaseapp.com",

    projectId:
    "souq-mubasher-c9d87",

    storageBucket:
    "souq-mubasher-c9d87.firebasestorage.app",

    messagingSenderId:
    "34321703167",

    appId:
    "1:34321703167:web:bbea33f93d9485fc97acca"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =========================================
   المدير
========================================= */

const ADMIN_EMAILS = [

    "waleedahmad@gmail.com",

    "waleedahmadahmad@gmail.com",

    "waleedahmad2031@gmail.com"

];


/* =========================================
   عناصر حسابي
========================================= */

const depositAmount =
document.getElementById(
    "depositAmount"
);

const depositNote =
document.getElementById(
    "depositNote"
);

const withdrawAmount =
document.getElementById(
    "withdrawAmount"
);

const withdrawNote =
document.getElementById(
    "withdrawNote"
);

const depositButton =
document.getElementById(
    "depositButton"
);

const withdrawButton =
document.getElementById(
    "withdrawButton"
);

const myBalance =
document.getElementById(
    "myBalance"
);

const transactionsList =
document.getElementById(
    "transactionsList"
);

const moneyMessage =
document.getElementById(
    "moneyMessage"
);


/* =========================================
   عناصر حسابات البقالات
========================================= */

const shopNameInput =
document.getElementById(
    "shopName"
);

const productNameInput =
document.getElementById(
    "productName"
);

const amountInput =
document.getElementById(
    "amount"
);

const addSaleButton =
document.getElementById(
    "addSale"
);

const addPaymentButton =
document.getElementById(
    "addPayment"
);

const accountsList =
document.getElementById(
    "accountsList"
);

const errorBox =
document.getElementById(
    "errorBox"
);


/* =========================================
   التحقق من المدير
========================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
                "admin-login.html";

            return;

        }


        const email =
            String(user.email || "")
            .toLowerCase();


        if(
            !ADMIN_EMAILS.includes(email)
        ){

            window.location.href =
                "admin-login.html";

            return;

        }


        await loadAllData();

    }
);


/* =========================================
   تحميل كل البيانات
========================================= */

async function loadAllData(){

    await Promise.all([

        loadTransactions(),

        loadAccounts()

    ]);

}


/* =========================================
   إظهار خطأ الأموال
========================================= */

function showMoneyError(message){

    moneyMessage.textContent =
        message;

    moneyMessage.style.display =
        "block";

}


/* =========================================
   إضافة إيداع
========================================= */

depositButton.addEventListener(
    "click",
    async () => {

        moneyMessage.style.display =
            "none";


        const amount =
            Number(
                depositAmount.value
            );


        const note =
            depositNote.value.trim();


        if(
            !amount ||
            amount <= 0
        ){

            showMoneyError(
                "اكتب مبلغ إيداع صحيح."
            );

            return;

        }


        if(!note){

            showMoneyError(
                "اكتب ملاحظة للإيداع."
            );

            return;

        }


        depositButton.disabled =
            true;

        depositButton.textContent =
            "⏳ جاري الحفظ...";


        try{

            await addDoc(

                collection(
                    db,
                    "adminTransactions"
                ),

                {

                    type:
                        "إيداع",

                    amount:
                        amount,

                    note:
                        note,

                    createdAt:
                        serverTimestamp()

                }

            );


            depositAmount.value =
                "";

            depositNote.value =
                "";


            alert(
                "تم حفظ الإيداع بنجاح ✅"
            );


            await loadTransactions();


        }catch(error){

            console.error(
                "Deposit Error:",
                error
            );


            showMoneyError(
                "تعذر حفظ الإيداع:\n" +
                error.message
            );

        }


        depositButton.disabled =
            false;

        depositButton.textContent =
            "➕ حفظ الإيداع";

    }
);


/* =========================================
   إضافة سحب
========================================= */

withdrawButton.addEventListener(
    "click",
    async () => {

        moneyMessage.style.display =
            "none";


        const amount =
            Number(
                withdrawAmount.value
            );


        const note =
            withdrawNote.value.trim();


        if(
            !amount ||
            amount <= 0
        ){

            showMoneyError(
                "اكتب مبلغ سحب صحيح."
            );

            return;

        }


        if(!note){

            showMoneyError(
                "اكتب ملاحظة للسحب."
            );

            return;

        }


        withdrawButton.disabled =
            true;

        withdrawButton.textContent =
            "⏳ جاري الحفظ...";


        try{

            await addDoc(

                collection(
                    db,
                    "adminTransactions"
                ),

                {

                    type:
                        "سحب",

                    amount:
                        amount,

                    note:
                        note,

                    createdAt:
                        serverTimestamp()

                }

            );


            withdrawAmount.value =
                "";

            withdrawNote.value =
                "";


            alert(
                "تم حفظ السحب بنجاح ✅"
            );


            await loadTransactions();


        }catch(error){

            console.error(
                "Withdraw Error:",
                error
            );


            showMoneyError(
                "تعذر حفظ السحب:\n" +
                error.message
            );

        }


        withdrawButton.disabled =
            false;

        withdrawButton.textContent =
            "➖ حفظ السحب";

    }
);


/* =========================================
   تحميل إيداعاتي وسحوباتي
========================================= */

async function loadTransactions(){

    try{

        const snapshot =
            await getDocs(

                collection(
                    db,
                    "adminTransactions"
                )

            );


        const transactions =
            snapshot.docs.map(
                item => ({

                    id:
                        item.id,

                    ...item.data()

                })
            );


        renderTransactions(
            transactions
        );


    }catch(error){

        console.error(
            "Transactions Error:",
            error
        );


        transactionsList.innerHTML = `

            <div class="error">

            ❌ تعذر تحميل الإيداعات والسحوبات

            <br><br>

            ${escapeHTML(
                error.message
            )}

            </div>

        `;

    }

}


/* =========================================
   عرض الإيداعات والسحوبات
========================================= */

function renderTransactions(
    transactions
){

    let balance = 0;


    transactions.forEach(
        transaction => {

            const amount =
                Number(
                    transaction.amount || 0
                );


            if(
                transaction.type ===
                "إيداع"
            ){

                balance +=
                    amount;

            }else if(
                transaction.type ===
                "سحب"
            ){

                balance -=
                    amount;

            }

        }
    );


    myBalance.textContent =
        balance + " ريال";


    if(!transactions.length){

        transactionsList.innerHTML = `

            <div class="empty">

            لا توجد إيداعات أو سحوبات حتى الآن.

            </div>

        `;

        return;

    }


    transactions.sort(
        (a,b) => {

            const dateA =
                a.createdAt?.toMillis
                ? a.createdAt.toMillis()
                : 0;

            const dateB =
                b.createdAt?.toMillis
                ? b.createdAt.toMillis()
                : 0;

            return dateB - dateA;

        }
    );


    transactionsList.innerHTML =
        transactions.map(
            transaction => {

                const amount =
                    Number(
                        transaction.amount || 0
                    );


                const isDeposit =
                    transaction.type ===
                    "إيداع";


                return `

                <div class="transaction">

                    <div class="${
                        isDeposit
                        ? "deposit-text"
                        : "withdraw-text"
                    }">

                    ${
                        isDeposit
                        ? "➕ إيداع"
                        : "➖ سحب"
                    }

                    :

                    ${
                        amount
                    } ريال

                    </div>


                    <div>

                    📝

                    ${
                        escapeHTML(
                            transaction.note ||
                            ""
                        )
                    }

                    </div>


                    <div class="small">

                    ${
                        formatDate(
                            transaction.createdAt
                        )
                    }

                    </div>


                    <div class="actions">

                    <button
                    class="delete-btn"
                    onclick="deleteTransaction('${transaction.id}')">

                    🗑️ حذف

                    </button>

                    </div>

                </div>

                `;

            }
        ).join("");

}


/* =========================================
   حذف حركة مالية
========================================= */

window.deleteTransaction =
async function(id){

    const confirmed =
        confirm(
            "هل تريد حذف هذه الحركة نهائيًا؟"
        );


    if(!confirmed){

        return;

    }


    try{

        await deleteDoc(

            doc(
                db,
                "adminTransactions",
                id
            )

        );


        await loadTransactions();


        alert(
            "تم حذف الحركة ✅"
        );


    }catch(error){

        console.error(
            "Delete Transaction Error:",
            error
        );


        showMoneyError(
            "تعذر حذف الحركة:\n" +
            error.message
        );

    }

};


/* =========================================
   حسابات البقالات
========================================= */

async function addMovement(type){

    errorBox.style.display =
        "none";


    const shopName =
        shopNameInput.value.trim();


    const productName =
        productNameInput.value.trim();


    const amount =
        Number(
            amountInput.value
        );


    if(!shopName){

        showAccountError(
            "اكتب اسم البقالة."
        );

        return;

    }


    if(
        !amount ||
        amount <= 0
    ){

        showAccountError(
            "اكتب مبلغًا صحيحًا."
        );

        return;

    }


    if(
        type === "sale" &&
        !productName
    ){

        showAccountError(
            "اكتب اسم المنتج."
        );

        return;

    }


    const button =
        type === "sale"
        ? addSaleButton
        : addPaymentButton;


    button.disabled =
        true;


    button.textContent =
        "⏳ جاري الحفظ...";


    try{

        await addDoc(

            collection(
                db,
                "accounts"
            ),

            {

                shopName:
                    shopName,

                productName:
                    productName,

                amount:
                    amount,

                type:
                    type,

                createdAt:
                    serverTimestamp()

            }

        );


        productNameInput.value =
            "";

        amountInput.value =
            "";


        alert(
            type === "sale"
            ? "تم تسجيل البيع الآجل ✅"
            : "تم تسجيل السداد ✅"
        );


        await loadAccounts();


    }catch(error){

    console.error("FIREBASE ERROR:", error);

    alert(
        "خطأ Firebase:\n\n" +
        error.code +
        "\n\n" +
        error.message
    );

    }

    


    button.disabled =
        false;


    button.textContent =
        type === "sale"
        ? "➕ إضافة بيع آجل"
        : "💵 تسجيل سداد";

}


/* =========================================
   إظهار خطأ الحسابات
========================================= */

function showAccountError(message){

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


/* =========================================
   زر البيع الآجل
========================================= */

addSaleButton.addEventListener(
    "click",
    () => {

        addMovement(
            "sale"
        );

    }
);


/* =========================================
   زر السداد
========================================= */

addPaymentButton.addEventListener(
    "click",
    () => {

        addMovement(
            "payment"
        );

    }
);


/* =========================================
   تحميل حسابات البقالات
========================================= */

async function loadAccounts(){

    try{

        const snapshot =
            await getDocs(

                collection(
                    db,
                    "accounts"
                )

            );


        const movements =
            snapshot.docs.map(
                item => ({

                    id:
                        item.id,

                    ...item.data()

                })
            );


        renderAccounts(
            movements
        );


    }catch(error){

        console.error(
            "Accounts Error:",
            error
        );


        accountsList.innerHTML = `

            <div class="error">

            ❌ تعذر تحميل حسابات البقالات

            <br><br>

            ${escapeHTML(
                error.message
            )}

            </div>

        `;

    }

}


/* =========================================
   عرض حسابات البقالات
========================================= */

function renderAccounts(
    movements
){

    if(!movements.length){

        accountsList.innerHTML = `

            <div class="empty">

            لا توجد حركات حسابية حتى الآن.

            <br><br>

            أضف أول بيع آجل أو سداد.

            </div>

        `;

        return;

    }


    const shops = {};


    movements.forEach(
        movement => {

            const shop =
                movement.shopName ||
                "بقالة بدون اسم";


            if(!shops[shop]){

                shops[shop] = {

                    balance:0,

                    movements:[]

                };

            }


            const amount =
                Number(
                    movement.amount || 0
                );


            if(
                movement.type ===
                "payment"
            ){

                shops[shop].balance -=
                    amount;

            }else{

                shops[shop].balance +=
                    amount;

            }


            shops[shop].movements.push(
                movement
            );

        }
    );


    accountsList.innerHTML =
        Object.entries(shops)
        .map(
            ([shop,data]) => {

                const balance =
                    data.balance;


                const balanceClass =
                    balance > 0
                    ? "debt"
                    : "paid";


                const balanceText =
                    balance > 0
                    ? `عليه ${balance} ريال`
                    : balance < 0
                    ? `له ${Math.abs(balance)} ريال`
                    : "الحساب مسدد";


                const lines =
                    data.movements
                    .slice()
                    .reverse()
                    .map(
                        movement => {

                            const amount =
                                Number(
                                    movement.amount || 0
                                );


                            if(
                                movement.type ===
                                "payment"
                            ){

                                return `

                                <div class="line">

                                💵 <b>سداد</b>

                                <br>

                                المبلغ:
                                ${amount} ريال

                                </div>

                                `;

                            }


                            return `

                            <div class="line">

                            🛒 <b>بيع آجل</b>

                            <br>

                            المنتج:
                            ${escapeHTML(
                                movement.productName ||
                                ""
                            )}

                            <br>

                            المبلغ:
                            ${amount} ريال

                            </div>

                            `;

                        }
                    )
                    .join("");


                return `

                <div class="shop">

                    <div class="shop-title">

                    🏪
                    ${escapeHTML(shop)}

                    </div>


                    <div class="balance ${balanceClass}">

                    الرصيد:
                    ${balanceText}

                    </div>


                    <div style="margin-top:12px">

                    ${lines}

                    </div>

                </div>

                `;

            }
        )
        .join("");

}


/* =========================================
   التاريخ
========================================= */

function formatDate(timestamp){

    if(
        !timestamp ||
        !timestamp.toDate
    ){

        return "الآن";

    }


    try{

        return timestamp
            .toDate()
            .toLocaleString(
                "ar-SA"
            );

    }catch(error){

        return "التاريخ غير متوفر";

    }

}


/* =========================================
   حماية النصوص
========================================= */

function escapeHTML(value){

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
