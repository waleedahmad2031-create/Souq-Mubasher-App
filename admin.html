<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الإدارة | سوق مباشر</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f5f6f8;
    color:#222;
}

header{
    background:#0d6efd;
    color:white;
    padding:18px 15px;
    text-align:center;
}

header h1{
    font-size:24px;
}

header p{
    margin-top:6px;
    font-size:13px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px 15px;
}

.box{
    background:white;
    padding:18px;
    border-radius:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
    margin-bottom:15px;
}

.box h2{
    color:#0d6efd;
    font-size:19px;
    margin-bottom:16px;
}

.hidden{
    display:none !important;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:12px;
    font-size:15px;
    outline:none;
    background:white;
}

textarea{
    min-height:90px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#0d6efd;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:6px;
}

button{
    border:none;
    border-radius:10px;
    padding:12px 15px;
    font-size:15px;
    cursor:pointer;
}

.login-btn{
    width:100%;
    background:#0d6efd;
    color:white;
}

.logout{
    background:#dc3545;
    color:white;
    width:100%;
    margin-top:12px;
}

.login-error{
    color:#dc3545;
    text-align:center;
    margin-top:10px;
}

.nav{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:15px;
}

.nav button{
    background:white;
    color:#333;
    box-shadow:0 2px 7px rgba(0,0,0,.07);
}

.nav button.active{
    background:#0d6efd;
    color:white;
}

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-bottom:15px;
}

.stat{
    background:white;
    border-radius:14px;
    padding:15px 8px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.stat-number{
    font-size:23px;
    font-weight:bold;
    color:#0d6efd;
    margin-bottom:6px;
}

.stat-title{
    font-size:12px;
    color:#666;
}

.primary{
    background:#0d6efd;
    color:white;
}

.success{
    background:#198754;
    color:white;
}

.warning{
    background:#ffc107;
    color:#222;
}

.danger{
    background:#dc3545;
    color:white;
}

.gray{
    background:#6c757d;
    color:white;
}

.products-grid,
.orders{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.product-card,
.order-card{
    background:white;
    border-radius:15px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.product-card{
    display:flex;
    gap:15px;
    align-items:center;
}

.product-image{
    width:90px;
    height:90px;
    border-radius:12px;
    object-fit:cover;
    background:#eee;
    flex-shrink:0;
}

.no-image{
    width:90px;
    height:90px;
    border-radius:12px;
    background:#eee;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    flex-shrink:0;
}

.product-info{
    flex:1;
}

.product-name{
    font-weight:bold;
    font-size:17px;
    margin-bottom:5px;
}

.product-price{
    color:#0d6efd;
    font-weight:bold;
    margin:5px 0;
}

.product-description{
    color:#777;
    font-size:13px;
    line-height:1.6;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:10px;
}

.actions button{
    flex:1;
    min-width:90px;
}

.order-header{
    display:flex;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid #eee;
    padding-bottom:10px;
    margin-bottom:10px;
}

.order-number{
    color:#0d6efd;
    font-weight:bold;
}

.badge{
    padding:6px 10px;
    border-radius:8px;
    background:#fff3cd;
    color:#856404;
    font-size:12px;
}

.info{
    line-height:2;
    font-size:14px;
}

.order-products{
    margin-top:10px;
    border-top:1px solid #eee;
    padding-top:10px;
}

.order-product{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
    border-bottom:1px solid #f1f1f1;
    font-size:14px;
}

.order-total{
    display:flex;
    justify-content:space-between;
    border-top:1px solid #ddd;
    padding-top:10px;
    margin-top:10px;
    font-size:18px;
    font-weight:bold;
}

.empty{
    background:white;
    border-radius:15px;
    padding:35px 20px;
    text-align:center;
    color:#777;
}

.loading{
    text-align:center;
    padding:25px;
    color:#777;
}

.image-preview{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:12px;
    margin-bottom:12px;
    display:none;
}

.form-buttons{
    display:flex;
    gap:8px;
}

.form-buttons button{
    flex:1;
}

@media(max-width:700px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .nav{
        grid-template-columns:repeat(2,1fr);
    }

    .product-card{
        align-items:flex-start;
    }

}

</style>

</head>

<body>

<header>

<h1>🛒 سوق مباشر</h1>

<p>لوحة الإدارة الشاملة</p>

</header>


<div class="container">


<!-- تسجيل الدخول -->

<div id="loginBox" class="box">

<h2>🔐 دخول الإدارة</h2>

<label>البريد الإلكتروني</label>

<input
type="email"
id="email"
placeholder="اكتب إيميل الإدارة"
>

<label>كلمة المرور</label>

<input
type="password"
id="password"
placeholder="اكتب كلمة المرور"
>

<button
class="login-btn"
id="loginButton"
onclick="login()">

🔑 دخول

</button>

<div id="loginError" class="login-error"></div>

</div>


<!-- لوحة الإدارة -->

<div id="adminBox" class="hidden">


<div class="box">

<h2>👨‍💼 لوحة الإدارة</h2>

<div id="adminEmail"
style="color:#666;font-size:14px;">
</div>

<button
class="logout"
onclick="logout()">

🚪 تسجيل الخروج

</button>

</div>


<!-- التنقل -->

<div class="nav">

<button
id="navStats"
class="active"
onclick="showSection('statsSection')">

📊 الإحصائيات

</button>

<button
id="navProducts"
onclick="showSection('productsSection')">

🛍️ المنتجات

</button>

<button
id="navOrders"
onclick="showSection('ordersSection')">

📋 الطلبات

</button>

<button
id="navArchive"
onclick="showSection('archiveSection')">

🗄️ الأرشيف

</button>

</div>


<!-- الإحصائيات -->

<section id="statsSection">

<div class="stats">

<div class="stat">

<div
class="stat-number"
id="statProducts">
0
</div>

<div class="stat-title">
المنتجات
</div>

</div>


<div class="stat">

<div
class="stat-number"
id="statOrders">
0
</div>

<div class="stat-title">
كل الطلبات
</div>

</div>


<div class="stat">

<div
class="stat-number"
id="statNew">
0
</div>

<div class="stat-title">
طلبات جديدة
</div>

</div>


<div class="stat">

<div
class="stat-number"
id="statDone">
0
</div>

<div class="stat-title">
تم التوصيل
</div>

</div>


<div class="stat">

<div
class="stat-number"
id="statSales">
0
</div>

<div class="stat-title">
إجمالي المبيعات
</div>

</div>

</div>

</section>


<!-- المنتجات -->

<section
id="productsSection"
class="hidden">

<div class="box">

<h2 id="productFormTitle">
➕ إضافة منتج
</h2>


<input
type="hidden"
id="editProductId"
>


<label>
اسم المنتج
</label>

<input
type="text"
id="productName"

>


<label>

</label>

<input
type="number"
id="productPrice"
placeholder="السعر بالريال"
>

</label>

<select id="productCategory">

<option value="مواد غذائية">
مواد غذائية
</option>

<option value="خضروات وفواكه">
خضروات وفواكه
</option>

<option value="زيوت">
زيوت
</option>

<option value="منزلية">
منزلية
</option>

<option value="أخرى">
أخرى
</option>

</select>


<label>
الوصف
</label>

id="productDescription"
placeholder="وصف المنتج"
></textarea>

</label>

id="productImage"
accept="image/*"

>

>

style="font-size:13px;color:#777;margin-bottom:10px;">
</div>

class="primary"
onclick="saveProduct()">

📦 المنتجات الموجودة
</h2>

<section
id="ordersSection"
class="hidden">

<h2>
📋 الطلبات الحالية
</h2>

id="ordersList"
class="orders">

⏳ جاري تحميل الطلبات...
</div>

</div>

</div>

</section>


<!-- الأرشيف -->

<section
id="archiveSection"
class="hidden">

<div class="box">

<h2>
🗄️ أرشيف الطلبات
</h2>

<div
id="archiveList"
class="orders">

<div class="loading">
⏳ جاري تحميل الأرشيف...
</div>

</div>

</section>


</div>

</div>


<script type="module">

import { db } from "./firebase.js";

import {

    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

    collection,
    getDocs,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    query,
    orderBy,
    serverTimestamp

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {

    getStorage,
    ref,
    uploadBytes,
    getDownloadURL,
    deleteObject

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";


const auth =
getAuth();


const storage =
getStorage();


let allProducts = [];

let allOrders = [];


/* =========================================
   تسجيل الدخول
========================================= */

window.login = async function(){

    const email =
    document.getElementById("email")
    .value.trim();

    const password =
    document.getElementById("password")
    .value;

    const error =
    document.getElementById("loginError");

    const button =
    document.getElementById("loginButton");


    error.textContent = "";


    if(!email){

        error.textContent =
        "اكتب البريد الإلكتروني";

        return;

    }


    if(!password){

        error.textContent =
        "اكتب كلمة المرور";

        return;

    }


    button.disabled = true;

    button.textContent =
    "⏳ جاري الدخول...";


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }catch(error){

        console.error(error);

        document.getElementById(
            "loginError"
        ).textContent =
        "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

        button.disabled = false;

        button.textContent =
        "🔑 دخول";

    }

};


/* =========================================
   حالة تسجيل الدخول
========================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(user){

            document.getElementById(
                "loginBox"
            ).classList.add("hidden");


            document.getElementById(
                "adminBox"
            ).classList.remove("hidden");


            document.getElementById(
                "adminEmail"
            ).textContent =
            "تم تسجيل الدخول: " +
            user.email;


            await loadEverything();

        }else{

            document.getElementById(
                "loginBox"
            ).classList.remove("hidden");


            document.getElementById(
                "adminBox"
            ).classList.add("hidden");

        }

    }
);


/* =========================================
   تحميل كل البيانات
========================================= */

async function loadEverything(){

    await loadProducts();

    await loadOrders();

    updateStats();

}


/* =========================================
   المنتجات
========================================= */

async function loadProducts(){

    const box =
    document.getElementById(
        "productsList"
    );


    box.innerHTML =
    '<div class="loading">⏳ جاري تحميل المنتجات...</div>';


    try{

        const snapshot =
        await getDocs(
            collection(
                db,
                "products"
            )
        );


        allProducts = [];


        snapshot.forEach(itemDoc => {

            allProducts.push({

                id:itemDoc.id,

                ...itemDoc.data()

            });

        });


        renderProducts();

    }catch(error){

        console.error(error);

        box.innerHTML =
        '<div class="empty">❌ تعذر تحميل المنتجات</div>';

    }

}


/* =========================================
   عرض المنتجات
========================================= */

function renderProducts(){

    const box =
    document.getElementById(
        "productsList"
    );


    if(allProducts.length === 0){

        box.innerHTML =
        '<div class="empty">📦 لا توجد منتجات</div>';

        return;

    }


    let html = "";


    allProducts.forEach(product => {

        const name =
        product.name ||
        product.اسم ||
        "بدون اسم";


        const price =
        Number(
            product.price ??
            product.سعر ??
            0
        );


        const description =
        product.description ||
        product.الوصف ||
        "";


        const image =
        product.image ||
        product.صورة ||
        "";


        html += `

        <div class="product-card">

            ${
                image
                ?
                `<img
                    src="${image}"
                    class="product-image"
                >`
                :
                `<div class="no-image">🖼️</div>`
            }

            <div class="product-info">

                <div class="product-name">
                    ${escapeHTML(name)}
                </div>

                <div class="product-price">
                    ${price} ريال
                </div>

                <div class="product-description">
                    ${escapeHTML(description)}
                </div>

                <div class="actions">

                    <button
                    class="warning"
                    onclick="editProduct('${product.id}')">

                    ✏️ تعديل

                    </button>

                    <button
                    class="danger"
                    onclick="deleteProduct('${product.id}')">

                    🗑️ حذف

                    </button>

                </div>

            </div>

        </div>

        `;

    });


    box.innerHTML =
    html;

}


/* =========================================
   معاينة الصورة
========================================= */

window.previewImage =
function(){

    const file =
    document.getElementById(
        "productImage"
    ).files[0];


    const preview =
    document.getElementById(
        "imagePreview"
    );


    if(!file){

        preview.style.display =
        "none";

        return;

    }


    preview.src =
    URL.createObjectURL(file);

    preview.style.display =
    "block";

};


/* =========================================
   حفظ المنتج
========================================= */

window.saveProduct =
async function(){

    const id =
    document.getElementById(
        "editProductId"
    ).value;


    const name =
    document.getElementById(
        "productName"
    ).value.trim();


    const price =
    Number(
        document.getElementById(
            "productPrice"
        ).value
    );


    const category =
    document.getElementById(
        "productCategory"
    ).value;


    const description =
    document.getElementById(
        "productDescription"
    ).value.trim();


    const imageFile =
    document.getElementById(
        "productImage"
    ).files[0];


    const status =
    document.getElementById(
        "uploadStatus"
    );


    if(!name){

        alert("اكتب اسم المنتج");

        return;

    }


    if(!price || price < 0){

        alert("اكتب السعر");

        return;

    }


    const button =
    document.querySelector(
        "#productsSection .primary"
    );


    button.disabled = true;

    status.textContent =
    "⏳ جاري حفظ المنتج...";


    try{

        let imageURL = "";


        const oldProduct =
        allProducts.find(
            p => p.id === id
        );


        if(oldProduct){

            imageURL =
            oldProduct.image ||
            oldProduct.صورة ||
            "";

        }


        /* رفع صورة جديدة */

        if(imageFile){

            const fileName =
            Date.now() +
            "_" +
            imageFile.name
            .replace(/\s+/g,"_");


            const storageRef =
            ref(
                storage,
                "products/" +
                fileName
            );


            const upload =
            await uploadBytes(
                storageRef,
                imageFile
            );


            imageURL =
            await getDownloadURL(
                upload.ref
            );

        }


        const productData = {

            name:name,

            price:price,

            category:category,

            description:description,

            image:imageURL,

            updatedAt:
            serverTimestamp()

        };


        if(id){

            await updateDoc(

                doc(
                    db,
                    "products",
                    id
                ),

                productData

            );


            alert(
                "تم تعديل المنتج بنجاح ✅"
            );

        }else{

            await addDoc(

                collection(
                    db,
                    "products"
                ),

                {

                    ...productData,

                    createdAt:
                    serverTimestamp()

                }

            );


            alert(
                "تمت إضافة المنتج بنجاح ✅"
            );

        }


        resetProductForm();

        await loadProducts();

        updateStats();


    }catch(error){

        console.error(
            "Save Product Error:",
            error
        );


        alert(
            "تعذر حفظ المنتج ❌\n\n" +
            error.message
        );

    }


    button.disabled = false;

    status.textContent = "";

};


/* =========================================
   تعديل المنتج
========================================= */

window.editProduct =
function(id){

    const product =
    allProducts.find(
        p => p.id === id
    );


    if(!product){

        alert("المنتج غير موجود");

        return;

    }


    document.getElementById(
        "editProductId"
    ).value =
    product.id;


    document.getElementById(
        "productName"
    ).value =
    product.name ||
    product.اسم ||
    "";


    document.getElementById(
        "productPrice"
    ).value =
    product.price ??
    product.سعر ??
    "";


    document.getElementById(
        "productCategory"
    ).value =
    product.category ||
    "أخرى";


    document.getElementById(
        "productDescription"
    ).value =
    product.description ||
    product.الوصف ||
    "";


    const image =
    product.image ||
    product.صورة ||
    "";


    const preview =
    document.getElementById(
        "imagePreview"
    );


    if(image){

        preview.src =
        image;

        preview.style.display =
        "block";

    }else{

        preview.style.display =
        "none";

    }


    document.getElementById(
        "productFormTitle"
    ).textContent =
    "✏️ تعديل المنتج";


    showSection(
        "productsSection"
    );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

};


/* =========================================
   حذف المنتج
========================================= */

window.deleteProduct =
async function(id){

    const product =
    allProducts.find(
        p => p.id === id
    );


    if(!product){

        return;

    }


    const name =
    product.name ||
    product.اسم ||
    "هذا المنتج";


    if(!confirm(
        "هل تريد حذف " +
        name +
        "؟"
    )){

        return;

    }


    try{

        await deleteDoc(

            doc(
                db,
                "products",
                id
            )

        );


        alert(
            "تم حذف المنتج ✅"
        );


        await loadProducts();

        updateStats();


    }catch(error){

        console.error(error);

        alert(
            "تعذر حذف المنتج ❌"
        );

    }

};


/* =========================================
   إعادة نموذج المنتج
========================================= */

window.resetProductForm =
function(){

    document.getElementById(
        "editProductId"
    ).value = "";


    document.getElementById(
        "productName"
    ).value = "";


    document.getElementById(
        "productPrice"
    ).value = "";


    document.getElementById(
        "productDescription"
    ).value = "";


    document.getElementById(
        "productCategory"
    ).value =
    "مواد غذائية";


    document.getElementById(
        "productImage"
    ).value = "";


    document.getElementById(
        "imagePreview"
    ).style.display =
    "none";


    document.getElementById(
        "productFormTitle"
    ).textContent =
    "➕ إضافة منتج";

};


/* =========================================
   الطلبات
========================================= */

async function loadOrders(){

    const ordersList =
    document.getElementById(
        "ordersList"
    );


    const archiveList =
    document.getElementById(
        "archiveList"
    );


    ordersList.innerHTML =
    '<div class="loading">⏳ جاري تحميل الطلبات...</div>';


    archiveList.innerHTML =
    '<div class="loading">⏳ جاري تحميل الأرشيف...</div>';


    try{

        const q =
        query(

            collection(
                db,
                "orders"
            ),

            orderBy(
                "createdAt",
                "desc"
            )

        );


        const snapshot =
        await getDocs(q);


        allOrders = [];


        snapshot.forEach(orderDoc => {

            allOrders.push({

                id:orderDoc.id,

                ...orderDoc.data()

            });

        });


        renderOrders();

        renderArchive();

    }catch(error){

        console.error(error);

        ordersList.innerHTML =
        '<div class="empty">❌ تعذر تحميل الطلبات</div>';

        archiveList.innerHTML =
        '<div class="empty">❌ تعذر تحميل الأرشيف</div>';

    }

}


/* =========================================
   إنشاء بطاقة طلب
========================================= */

function orderHTML(order){

    const orderNumber =
    order.orderNumber ||
    order.id;


    const customerName =
    order.customerName ||
    "غير معروف";


    const phone =
    order.customerPhone ||
    "غير مسجل";


    const address =
    order.customerAddress ||
    "غير مسجل";


    const notes =
    order.notes ||
    "لا توجد ملاحظات";


    const status =
    order.status ||
    "جديد";


    const total =
    Number(
        order.total || 0
    );


    let productsHTML = "";


    if(Array.isArray(order.products)){

        order.products.forEach(
            product => {

                const quantity =
                Number(
                    product.quantity || 1
                );


                const price =
                Number(
                    product.price || 0
                );


                const itemTotal =
                quantity * price;


                productsHTML += `

                <div class="order-product">

                    <span>
                        ${escapeHTML(
                            product.name || ""
                        )}
                        ×
                        ${quantity}
                    </span>

                    <strong>
                        ${itemTotal} ريال
                    </strong>

                </div>

                `;

            }
        );

    }


    return `

    <div class="order-card">

        <div class="order-header">

            <div class="order-number">
                🔢 الطلب #${orderNumber}
            </div>

            <div class="badge">
                ${escapeHTML(status)}
            </div>

        </div>


        <div class="info">

            <div>
                👤
                <strong>الاسم:</strong>
                ${escapeHTML(customerName)}
            </div>

            <div>
                📱
                <strong>الجوال:</strong>
                ${escapeHTML(phone)}
            </div>

            <div>
                📍
                <strong>العنوان:</strong>
                ${escapeHTML(address)}
            </div>

            <div>
                📝
                <strong>الطلب:</strong>
                ${escapeHTML(notes)}
            </div>

        </div>


        <div class="order-products">

            <strong>
                🛒 المنتجات
            </strong>

            ${productsHTML}

        </div>


        <div class="order-total">

            <span>
                الإجمالي
            </span>

            <span>
                ${total} ريال
            </span>

        </div>


        <div class="actions">

            ${
                status !== "جديد"
                ?
                `<button
                    class="warning"
                    onclick="changeStatus(
                        '${order.id}',
                        'جديد'
                    )">
                    🟡 جديد
                </button>`
                :
                ""
            }


            ${
                status !== "قيد التجهيز"
                ?
                `<button
                    class="primary"
                    onclick="changeStatus(
                        '${order.id}',
                        'قيد التجهيز'
                    )">
                    🔵 قيد التجهيز
                </button>`
                :
                ""
            }


            ${
                status !== "تم التوصيل"
                ?
                `<button
                    class="success"
                    onclick="changeStatus(
                        '${order.id}',
                        'تم التوصيل'
                    )">
                    🟢 تم التوصيل
                </button>`
                :
                ""
            }


            <button
            class="whatsapp"
            style="background:#25D366;color:white;"
            onclick="sendOrderWhatsApp('${order.id}')">

            📱 واتساب

            </button>

        </div>

    </div>

    `;

}


/* =========================================
   عرض الطلبات الحالية
========================================= */

function renderOrders(){

    const box =
    document.getElementById(
        "ordersList"
    );


    const current =
    allOrders.filter(
        order =>
        (order.status || "جديد")
        !==
        "تم التوصيل"
    );


    if(current.length === 0){

        box.innerHTML =
        '<div class="empty">📭 لا توجد طلبات حالية</div>';

        return;

    }


    box.innerHTML =
    current.map(orderHTML).join("");

}


/* =========================================
   عرض الأرشيف
========================================= */

function renderArchive(){

    const box =
    document.getElementById(
        "archiveList"
    );


    const archived =
    allOrders.filter(
        order =>
        order.status ===
        "تم التوصيل"
    );


    if(archived.length === 0){

        box.innerHTML =
        '<div class="empty">🗄️ الأرشيف فارغ</div>';

        return;

    }


    box.innerHTML =
    archived.map(orderHTML).join("");

}


/* =========================================
   تغيير حالة الطلب
========================================= */

window.changeStatus =
async function(
    id,
    newStatus
){

    try{

        await updateDoc(

            doc(
                db,
                "orders",
                id
            ),

            {
                status:newStatus
            }

        );


        await loadOrders();

        updateStats();


    }catch(error){

        console.error(error);

        alert(
            "تعذر تغيير حالة الطلب ❌"
        );

    }

};


/* =========================================
   واتساب الطلب
========================================= */

window.sendOrderWhatsApp =
function(id){

    const order =
    allOrders.find(
        item => item.id === id
    );


    if(!order){

        return;

    }


    const orderNumber =
    order.orderNumber ||
    order.id;


    const name =
    order.customerName ||
    "غير معروف";


    const phone =
    order.customerPhone ||
    "";


    const address =
    order.customerAddress ||
    "";


    const total =
    Number(
        order.total || 0
    );


    let message =

`🛒 طلب من سوق مباشر

🔢 رقم الطلب: ${orderNumber}

👤 الاسم: ${name}

📱 الجوال: ${phone}

📍 العنوان:
${address}

🛍️ المنتجات:
`;


    if(Array.isArray(order.products)){

        order.products.forEach(
            product => {

                const quantity =
                Number(
                    product.quantity || 1
                );


                const price =
                Number(
                    product.price || 0
                );


                message +=

`• ${product.name} × ${quantity} = ${quantity * price} ريال
`;

            }
        );

    }


    message +=

`
💰 الإجمالي: ${total} ريال
`;


    window.open(

        "https://wa.me/966550496391?text=" +

        encodeURIComponent(
            message
        ),

        "_blank"

    );

};


/* =========================================
   الإحصائيات
========================================= */

function updateStats(){

    document.getElementById(
        "statProducts"
    ).textContent =
    allProducts.length;


    document.getElementById(
        "statOrders"
    ).textContent =
    allOrders.length;


    const newOrders =
    allOrders.filter(
        order =>
        (order.status || "جديد")
        ===
        "جديد"
    ).length;


    const doneOrders =
    allOrders.filter(
        order =>
        order.status ===
        "تم التوصيل"
    ).length;


    const sales =
    allOrders
    .filter(
        order =>
        order.status ===
        "تم التوصيل"
    )
    .reduce(
        (sum,order) =>
        sum +
        Number(
            order.total || 0
        ),
        0
    );


    document.getElementById(
        "statNew"
    ).textContent =
    newOrders;


    document.getElementById(
        "statDone"
    ).textContent =
    doneOrders;


    document.getElementById(
        "statSales"
    ).textContent =
    sales + " ريال";

}


/* =========================================
   التنقل
========================================= */

window.showSection =
function(sectionId){

    const sections = [

        "statsSection",
        "productsSection",
        "ordersSection",
        "archiveSection"

    ];


    sections.forEach(id => {

        document.getElementById(
            id
        ).classList.add("hidden");

    });


    document.getElementById(
        sectionId
    ).classList.remove("hidden");


    document.querySelectorAll(
        ".nav button"
    ).forEach(button => {

        button.classList.remove(
            "active"
        );

    });


    if(sectionId === "statsSection"){

        document.getElementById(
            "navStats"
        ).classList.add("active");

    }


    if(sectionId === "productsSection"){

        document.getElementById(
            "navProducts"
        ).classList.add("active");

    }


    if(sectionId === "ordersSection"){

        document.getElementById(
            "navOrders"
        ).classList.add("active");

    }


    if(sectionId === "archiveSection"){

        document.getElementById(
            "navArchive"
        ).classList.add("active");

    }

};


/* =========================================
   حماية النصوص
========================================= */

function escapeHTML(value){

    return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

async function(){

    await signOut(auth);

};
