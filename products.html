<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>المنتجات | سوق مباشر</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f5f6f8;
    color:#222;
}

/* =========================
   الهيدر
========================= */

header{
    background:#0d6efd;
    color:white;
    padding:16px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:10;
}

header h1{
    font-size:23px;
}

header p{
    margin-top:5px;
    font-size:13px;
    opacity:.9;
}

/* =========================
   زر السلة
========================= */

.cart-button{
    display:block;
    width:100%;
    max-width:900px;
    margin:12px auto 0;
    padding:12px;
    background:white;
    color:#0d6efd;
    text-decoration:none;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
}

.cart-count{
    background:#dc3545;
    color:white;
    border-radius:20px;
    padding:3px 8px;
    margin-right:5px;
}

/* =========================
   المحتوى
========================= */

.container{
    max-width:900px;
    margin:auto;
    padding:20px 15px;
}

/* =========================
   البحث
========================= */

.search-box{
    background:white;
    padding:15px;
    border-radius:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
    margin-bottom:20px;
}

.search-box input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

.search-box input:focus{
    border-color:#0d6efd;
}

/* =========================
   المنتجات
========================= */

.products{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.product{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.product-image{
    height:150px;
    background:#eee;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product-info{
    padding:13px;
}

.product-name{
    font-size:16px;
    font-weight:bold;
    margin-bottom:8px;
}

.product-description{
    color:#777;
    font-size:13px;
    line-height:1.6;
    min-height:40px;
}

.price{
    color:#0d6efd;
    font-size:18px;
    font-weight:bold;
    margin:10px 0;
}

.add-btn{
    width:100%;
    border:none;
    background:#0d6efd;
    color:white;
    padding:11px;
    border-radius:9px;
    font-size:14px;
    cursor:pointer;
}

.add-btn:active{
    transform:scale(.98);
}

/* =========================
   لا توجد منتجات
========================= */

.empty{
    background:white;
    padding:30px;
    border-radius:15px;
    text-align:center;
    color:#777;
    grid-column:1/-1;
}

/* =========================
   خطأ التحميل
========================= */

.error{
    background:white;
    padding:30px 20px;
    border-radius:15px;
    text-align:center;
    color:#dc3545;
    grid-column:1/-1;
}

/* =========================
   الرجوع
========================= */

.back{
    display:block;
    text-align:center;
    margin-top:25px;
    color:#0d6efd;
    text-decoration:none;
    font-size:15px;
}

/* =========================
   الجوال
========================= */

@media(max-width:450px){

    .products{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .product-image{
        height:120px;
    }

    .product-info{
        padding:10px;
    }

    .product-name{
        font-size:14px;
    }

    .price{
        font-size:16px;
    }

}

</style>

</head>


<body>


<header>

<h1>🛒 منتجات سوق مباشر</h1>

<p>اختر المنتج الذي تبحث عنه</p>


<a
href="cart.html"
class="cart-button">

🛒 السلة

<span
id="cartCount"
class="cart-count">

0

</span>

</a>

</header>



<div class="container">


<!-- =========================
     البحث
========================= -->

<div class="search-box">

<input
type="search"
id="search"
placeholder="🔎 ابحث عن منتج..."
>

</div>



<!-- =========================
     المنتجات
========================= -->

<div
class="products"
id="products">

<div class="empty">

⏳

<h3 style="margin:12px 0;">

جاري تحميل المنتجات...

</h3>

</div>

</div>



<a
href="index.html"
class="back">

⬅️ العودة للرئيسية

</a>

</div>


<script type="module">

/* =========================================
   Firebase
========================================= */

import { db } from "./firebase.js";

import {
    collection,
    getDocs,
    addDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
   السلة
========================================= */

function getCart(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "souqMubasherCart"
            ) || "[]"
        );

    }catch(error){

        return [];

    }

}


function updateCartCount(){

    const cart = getCart();

    let count = 0;

    cart.forEach(item => {

        count += Number(
            item.quantity || 1
        );

    });

    document.getElementById(
        "cartCount"
    ).textContent = count;

}


/* =========================================
   المنتجات
========================================= */

let allProducts = [];


/* =========================================
   إعداد المشاهدات
========================================= */

/*
   نفس المنتج لا يحسب مرة أخرى
   من نفس الجهاز لمدة 30 دقيقة
*/

const VIEW_COOLDOWN =
    30 * 60 * 1000;


/* =========================================
   تسجيل مشاهدة المنتج
========================================= */

async function recordProductView(
    product
){

    try{

        const productId =
            String(product.id || "");

        if(!productId){

            return;

        }


        const storageKey =
            "souq_view_" + productId;


        const lastView =
            Number(
                localStorage.getItem(
                    storageKey
                ) || 0
            );


        const now =
            Date.now();


        /*
           منع تكرار المشاهدة
           خلال 30 دقيقة
        */

        if(
            lastView &&
            now - lastView <
            VIEW_COOLDOWN
        ){

            return;

        }


        /*
           حفظ وقت آخر مشاهدة
        */

        localStorage.setItem(
            storageKey,
            String(now)
        );


        /*
           تسجيل المشاهدة في Firebase
        */

        await addDoc(

            collection(
                db,
                "productEvents"
            ),

            {

                type:
                    "view",

                productId:
                    productId,

                productName:
                    String(
                        product.name ||
                        product.اسم ||
                        "منتج"
                    ),

                price:
                    Number(
                        product.price ??
                        product.سعر ??
                        0
                    ),

                category:
                    String(
                        product.category ||
                        product.القسم ||
                        ""
                    ),

                createdAt:
                    serverTimestamp()

            }

        );


        console.log(
            "تم تسجيل مشاهدة:",
            product.name ||
            product.اسم ||
            productId
        );


    }catch(error){

        console.error(
            "خطأ تسجيل المشاهدة:",
            error
        );

    }

}


/* =========================================
   مراقبة ظهور المنتجات على الشاشة
========================================= */

function observeProductViews(){

    const cards =
        document.querySelectorAll(
            ".product"
        );


    if(!cards.length){

        return;

    }


    /*
       IntersectionObserver
       يحسب المنتج عندما يظهر
       أمام الزائر
    */

    const observer =
        new IntersectionObserver(

            (entries, observer) => {

                entries.forEach(
                    entry => {

                        if(
                            !entry.isIntersecting
                        ){

                            return;

                        }


                        const productId =
                            entry.target.dataset
                            .productId;


                        if(!productId){

                            return;

                        }


                        const product =
                            allProducts.find(
                                item =>
                                item.id ===
                                productId
                            );


                        if(!product){

                            return;

                        }


                        recordProductView(
                            product
                        );


                        /*
                           نراقب البطاقة مرة واحدة
                           في هذه الزيارة
                        */

                        observer.unobserve(
                            entry.target
                        );

                    }
                );

            },

            {
                threshold:0.5
            }

        );


    cards.forEach(
        card => {

            observer.observe(
                card
            );

        }
    );

}


/* =========================================
   تحميل المنتجات
========================================= */

async function loadProducts(){

    const container =
        document.getElementById(
            "products"
        );


    try{

        console.log(
            "جاري الاتصال بـ Firebase..."
        );


        const snapshot =
            await getDocs(

                collection(
                    db,
                    "products"
                )

            );


        console.log(
            "عدد المنتجات:",
            snapshot.size
        );


        allProducts = [];


        snapshot.forEach(
            docSnapshot => {

                const data =
                    docSnapshot.data();


                allProducts.push({

                    id:
                        docSnapshot.id,

                    ...data

                });

            }
        );


        displayProducts(
            allProducts
        );


    }catch(error){

        console.error(
            "Products Error:",
            error
        );


        container.innerHTML = `

        <div class="error">

            ❌

            <h3 style="margin:12px 0;">

                تعذر تحميل المنتجات

            </h3>

            <p style="line-height:1.8;">

                ${error.message}

            </p>

        </div>

        `;

    }

}


/* =========================================
   عرض المنتجات
========================================= */

function displayProducts(products){

    const container =
        document.getElementById(
            "products"
        );


    if(
        !products ||
        products.length === 0
    ){

        container.innerHTML = `

        <div class="empty">

            🛒

            <h3 style="margin:12px 0;">

                لا توجد منتجات

            </h3>

            <p>

                سيتم إضافة المنتجات قريبًا.

            </p>

        </div>

        `;

        return;

    }


    let html = "";


    products.forEach(product => {


        const name =
            product.name ||
            product.اسم ||
            "منتج";


        const price =
            Number(
                product.price ??
                product.سعر ??
                0
            );


        const description =
            product.description ||
            product.الوصف ||
            "";


        const image =
            product.image ||
            product.صورة ||
            "";


        const category =
            product.category ||
            product.القسم ||
            "";


        let imageHTML = "🛒";


        if(image){

            imageHTML = `

            <img
                src="${escapeAttribute(image)}"
                alt="${escapeHTML(name)}"
                onerror="
                    this.onerror=null;
                    this.style.display='none';
                "
            >

            `;

        }


        html += `

        <div
            class="product"
            data-product-id="${escapeAttribute(
                product.id
            )}"
            data-name="${escapeHTML(
                String(name).toLowerCase()
            )}"
            data-description="${escapeHTML(
                String(description).toLowerCase()
            )}"
            data-category="${escapeHTML(
                String(category).toLowerCase()
            )}"
        >


            <div class="product-image">

                ${imageHTML}

            </div>


            <div class="product-info">


                <div class="product-name">

                    ${escapeHTML(name)}

                </div>


                <div class="product-description">

                    ${escapeHTML(description)}

                </div>


                <div class="price">

                    ${price} ريال

                </div>


                <button
                    class="add-btn"
                    data-id="${escapeAttribute(
                        product.id
                    )}"
                >

                    🛒 إضافة للسلة

                </button>


            </div>

        </div>

        `;

    });


    container.innerHTML =
        html;


    /* =====================================
       أزرار إضافة للسلة
    ===================================== */

    container
        .querySelectorAll(".add-btn")
        .forEach(button => {


            button.addEventListener(
                "click",
                function(){

                    const productId =
                        this.dataset.id;


                    const product =
                        allProducts.find(
                            item =>
                            item.id ===
                            productId
                        );


                    if(product){

                        addToCart(
                            product
                        );

                    }

                }
            );

        });


    /* =====================================
       تشغيل مراقبة المشاهدات
    ===================================== */

    observeProductViews();

}


/* =========================================
   إضافة للسلة
========================================= */

function addToCart(product){

    const name =
        product.name ||
        product.اسم ||
        "منتج";


    const price =
        Number(
            product.price ??
            product.سعر ??
            0
        );


    const image =
        product.image ||
        product.صورة ||
        "";


    const description =
        product.description ||
        product.الوصف ||
        "";


    let cart =
        getCart();


    const existing =
        cart.find(
            item =>
            item.id === product.id
        );


    if(existing){

        existing.quantity =
            Number(
                existing.quantity || 1
            ) + 1;

    }else{

        cart.push({

            id:
                product.id,

            name:
                name,

            price:
                price,

            image:
                image,

            description:
                description,

            quantity:
                1

        });

    }


    localStorage.setItem(

        "souqMubasherCart",

        JSON.stringify(cart)

    );


    updateCartCount();


    alert(

        "تمت إضافة " +
        name +
        " إلى السلة 🛒"

    );

}


/* =========================================
   البحث
========================================= */

function searchProducts(){

    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    if(!search){

        displayProducts(
            allProducts
        );

        return;

    }


    const filtered =
        allProducts.filter(
            product => {


                const name =
                    String(
                        product.name ||
                        product.اسم ||
                        ""
                    )
                    .toLowerCase();


                const description =
                    String(
                        product.description ||
                        product.الوصف ||
                        ""
                    )
                    .toLowerCase();


                const category =
                    String(
                        product.category ||
                        product.القسم ||
                        ""
                    )
                    .toLowerCase();


                return (

                    name.includes(search)

                    ||

                    description.includes(search)

                    ||

                    category.includes(search)

                );

            }
        );


    displayProducts(
        filtered
    );

}


document.getElementById(
    "search"
).addEventListener(
    "input",
    searchProducts
);


/* =========================================
   حماية النصوص
========================================= */

function escapeHTML(value){

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value){

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   تشغيل
========================================= */

updateCartCount();

loadProducts();

    </script>




</body>

    </html>
