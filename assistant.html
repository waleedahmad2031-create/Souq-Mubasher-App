<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مساعد سوق مباشر</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f5f6f8;
    color:#222;
}

header{
    background:#0d6efd;
    color:white;
    padding:18px 15px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

header h1{
    font-size:24px;
    margin-bottom:6px;
}

header p{
    font-size:14px;
    opacity:.9;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px 15px;
}

.assistant{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.welcome{
    text-align:center;
    margin-bottom:20px;
}

.welcome h2{
    color:#0d6efd;
    margin-bottom:8px;
}

.welcome p{
    color:#666;
    line-height:1.8;
}

.messages{
    min-height:250px;
    max-height:450px;
    overflow-y:auto;
    margin-bottom:15px;
}

.message{
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
    line-height:1.8;
}

.bot{
    background:#eef5ff;
    text-align:right;
}

.user{
    background:#0d6efd;
    color:white;
    text-align:right;
}

.product-card{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px;
    margin-top:10px;
}

.product-name{
    font-weight:bold;
    font-size:16px;
}

.product-price{
    margin-top:5px;
    color:#0d6efd;
    font-weight:bold;
}

.buy-btn{
    width:100%;
    margin-top:10px;
    background:#198754;
    color:white;
    border:none;
    border-radius:10px;
    padding:12px;
    font-size:15px;
    cursor:pointer;
}

.input-area{
    display:flex;
    gap:8px;
}

input{
    flex:1;
    border:1px solid #ddd;
    border-radius:12px;
    padding:13px;
    font-size:15px;
    outline:none;
}

.send{
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:12px;
    padding:13px 18px;
    cursor:pointer;
}

.back{
    width:100%;
    margin-top:15px;
    background:#e9ecef;
    color:#222;
    border:none;
    border-radius:12px;
    padding:13px;
    font-size:15px;
    cursor:pointer;
}

</style>

</head>

<body>

<header>

<h1>🤖 مساعد سوق مباشر</h1>

<p>اسأل عن الأسعار أو اطلب المنتجات</p>

</header>


<div class="container">

<div class="assistant">

<div class="welcome">

<h2>أهلاً بك 👋</h2>

<p>
أنا مساعد سوق مباشر.
<br>
اسألني عن السعر أو قل لي ماذا تريد شراءه.
</p>

</div>


<div class="messages" id="messages">

<div class="message bot">

🤖 أهلاً بك في مساعد سوق مباشر.

<br><br>

مثلاً اكتب:

<br>
<b>كم سعر السكر؟</b>

<br>
<b>اشتي أرز</b>

<br>
<b>أريد زيت</b>

</div>

</div>


<div class="input-area">

<input
type="text"
id="userInput"
placeholder="مثلاً: كم سعر السكر؟"
>

<button class="send" onclick="sendMessage()">
إرسال
</button>

</div>


<button class="back" onclick="location.href='index.html'">
⬅️ العودة إلى سوق مباشر
</button>

</div>

</div>


<script type="module">

import {
    collection,
    getDocs,
    addDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./firebase.js";


let products = [];


/*
نفس مفتاح السلة الموجود في cart.html
*/

const CART_KEY = "souqMubasherCart";


/* تحميل المنتجات */

async function loadProducts(){

    try{

        const snapshot =
            await getDocs(
                collection(db,"products")
            );

        products = [];

        snapshot.forEach(doc => {

            products.push({

                id:doc.id,

                ...doc.data()

            });

        });

        console.log(
            "تم تحميل المنتجات:",
            products.length
        );

    }catch(error){

        console.error(
            "خطأ في تحميل المنتجات:",
            error
        );

        showBot(
            "❌ حدث خطأ أثناء تحميل المنتجات."
        );

    }

}


/* =========================================
   تسجيل مشاهدة المنتج من المساعد فقط
========================================= */

const ASSISTANT_VIEW_COOLDOWN =
    30 * 60 * 1000;


async function recordAssistantView(product){

    try{

        const productId =
            String(product.id || "");

        if(!productId){

            return;

        }


        const storageKey =
            "souq_assistant_view_" +
            productId;


        const lastView =
            Number(
                localStorage.getItem(
                    storageKey
                ) || 0
            );


        const now =
            Date.now();


        /*
        منع تكرار المشاهدة
        لمدة 30 دقيقة
        */

        if(
            lastView &&
            now - lastView <
            ASSISTANT_VIEW_COOLDOWN
        ){

            return;

        }


        localStorage.setItem(
            storageKey,
            String(now)
        );


        /*
        نفس مجموعة المشاهدات الموجودة
        في products.html
        */

        await addDoc(

            collection(
                db,
                "productEvents"
            ),

            {

                type:
                    "view",

                source:
                    "assistant",

                productId:
                    productId,

                productName:
                    String(
                        product.name ||
                        product.اسم ||
                        "منتج"
                    ),

                price:
                    Number(
                        product.price ??
                        product.سعر ??
                        0
                    ),

                category:
                    String(
                        product.category ||
                        product.القسم ||
                        ""
                    ),

                createdAt:
                    serverTimestamp()

            }

        );


        console.log(
            "تم تسجيل مشاهدة المساعد:",
            product.name ||
            product.اسم ||
            productId
        );


    }catch(error){

        console.error(
            "خطأ تسجيل مشاهدة المساعد:",
            error
        );

    }

}


/* تنظيف النص */

function cleanText(text){

    return String(text || "")

        .toLowerCase()

        .replace(/[إأآ]/g,"ا")

        .replace(/ة/g,"ه")

        .replace(/ى/g,"ي")

        .replace(/\bال/g,"")

        .replace(/[؟?!.,،]/g,"")

        .replace(/\s+/g," ")

        .trim();

}


/* البحث عن المنتجات */

function searchProducts(question){

    const q =
        cleanText(question);

    if(!q) return [];


    const words =
        q.split(" ");


    const results =
        products.filter(product => {

            const name =
                cleanText(product.name);


            if(!name) return false;


            if(
                q.includes(name) ||
                name.includes(q)
            ){

                return true;

            }


            return words.some(word =>

                word.length >= 2 &&
                name.includes(word)

            );

        });


    return results;

}


/* معرفة هل المستخدم يريد الشراء */

function wantsToBuy(text){

    const q =
        cleanText(text);


    const words = [

        "اشتي",
        "ابغي",
        "اريد",
        "عايز",
        "شراء",
        "اشتري",
        "طلب",
        "اطلب",
        "جيب",
        "هات"

    ];


    return words.some(word =>
        q.includes(
            cleanText(word)
        )
    );

}


/* رسالة المساعد */

function showBot(html){

    const messages =
        document.getElementById(
            "messages"
        );


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message bot";


    message.innerHTML =
        html;


    messages.appendChild(
        message
    );


    messages.scrollTop =
        messages.scrollHeight;

}


/* رسالة المستخدم */

function showUser(text){

    const messages =
        document.getElementById(
            "messages"
        );


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message user";


    message.textContent =
        text;


    messages.appendChild(
        message
    );


    messages.scrollTop =
        messages.scrollHeight;

}


/* إضافة المنتج للسلة */

function addToCart(product){

    let cart = [];


    try{

        cart =
            JSON.parse(
                localStorage.getItem(
                    CART_KEY
                )
            ) || [];

    }catch(error){

        cart = [];

    }


    const existing =
        cart.find(item =>
            item.id === product.id
        );


    if(existing){

        existing.quantity =
            (existing.quantity || 1) + 1;

    }else{

        cart.push({

            id:product.id,

            name:product.name,

            price:Number(product.price) || 0,

            quantity:1

        });

    }


    /*
    حفظ السلة بنفس طريقة cart.html
    */

    localStorage.setItem(

        CART_KEY,

        JSON.stringify(cart)

    );


    /*
    الانتقال إلى السلة
    */

    setTimeout(() => {

        location.href =
            "cart.html";

    },500);

}


/* إرسال السؤال */

window.sendMessage =
async function(){

    const input =
        document.getElementById(
            "userInput"
        );


    const text =
        input.value.trim();


    if(!text) return;


    showUser(text);


    input.value = "";


    /*
    إذا المنتجات لم تحمل بعد
    */

    if(products.length === 0){

        await loadProducts();

    }


    const results =
        searchProducts(text);


    /*
    المنتج غير موجود
    */

    if(results.length === 0){

        showBot(

            "🤖 لم أجد هذا المنتج حالياً في سوق مباشر." +

            "<br><br>" +

            "جرب كتابة اسم المنتج فقط، مثل:" +

            "<br>السكر" +

            "<br>الأرز" +

            "<br>الدقيق" +

            "<br>الزيت"

        );

        return;

    }


    /*
    تسجيل المشاهدات من المساعد فقط
    */

    results
        .slice(0,5)
        .forEach(product => {

            recordAssistantView(
                product
            );

        });


    const buying =
        wantsToBuy(text);


    /*
    إذا كان يريد الشراء
    */

    if(buying){

        showBot(

            "🛒 فهمت أنك تريد الشراء." +

            "<br><br>" +

            "اختر المنتج الذي تريده:"

        );

    }else{

        showBot(

            "🔎 وجدت لك هذه المنتجات:"

        );

    }


    results
        .slice(0,5)
        .forEach(product => {

            const messages =
                document.getElementById(
                    "messages"
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "message bot product-card";


            const name =
                product.name ||
                "منتج";


            const price =
                product.price ??
                "غير محدد";


            card.innerHTML =

                "<div class='product-name'>" +

                "📦 " +
                name +

                "</div>" +

                "<div class='product-price'>" +

                "💰 " +
                price +
                " ريال" +

                "</div>" +

                "<button class='buy-btn'>" +

                "🛒 أضف إلى السلة" +

                "</button>";


            const button =
                card.querySelector(
                    ".buy-btn"
                );


            button.onclick =
                function(){

                    addToCart(
                        product
                    );

                };


            messages.appendChild(
                card
            );

        });


    const messages =
        document.getElementById(
            "messages"
        );


    messages.scrollTop =
        messages.scrollHeight;

};


/* زر Enter */

document
    .getElementById(
        "userInput"
    )
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                sendMessage();

            }

        }
    );


/* تشغيل تحميل المنتجات */

loadProducts();

</script>

</body>

    </html>
